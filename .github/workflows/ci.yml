name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "Gh Action -> Vercel"
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel secrets
        run: |
          missing=0
          TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n ')"
          ORG="$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\r\n ')"
          PROJECT="$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\r\n ')"
          if [ -z "$TOKEN" ]; then
            echo "Add GitHub Actions secret VERCEL_TOKEN from https://vercel.com/account/tokens"
            missing=1
          fi
          if [ -z "$ORG" ]; then
            echo "Add GitHub Actions secret VERCEL_ORG_ID (team_… from npx vercel link)"
            missing=1
          fi
          if [ -z "$PROJECT" ]; then
            echo "Add GitHub Actions secret VERCEL_PROJECT_ID (prj_… from npx vercel link)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          {
            echo "VERCEL_TOKEN=$TOKEN"
            echo "VERCEL_ORG_ID=$ORG"
            echo "VERCEL_PROJECT_ID=$PROJECT"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Link Vercel project
        run: |
          set -euo pipefail
          ORG="$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\r\n ')"
          PROJECT="$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\r\n ')"
          case "$ORG" in
            team_*) ;;
            prj_*)
              echo "VERCEL_ORG_ID starts with prj_. That value belongs in VERCEL_PROJECT_ID. Swap the two secrets."
              exit 1
              ;;
            *)
              echo "VERCEL_ORG_ID should start with team_ (from npx vercel link / .vercel/project.json orgId)."
              exit 1
              ;;
          esac
          case "$PROJECT" in
            prj_*) ;;
            team_*)
              echo "VERCEL_PROJECT_ID starts with team_. That value belongs in VERCEL_ORG_ID. Swap the two secrets."
              exit 1
              ;;
            *)
              echo "VERCEL_PROJECT_ID should start with prj_ (from npx vercel link / .vercel/project.json projectId)."
              exit 1
              ;;
          esac
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG" "$PROJECT" > .vercel/project.json
          echo "Linked orgId=${ORG} projectId=${PROJECT}"
      - name: Pull Vercel production env
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build for Vercel
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
