name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "Gh Action -> Vercel"
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel secrets
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Add GitHub Actions secret VERCEL_TOKEN from https://vercel.com/account/tokens"
            missing=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "Add GitHub Actions secret VERCEL_ORG_ID (team_… from npx vercel link)"
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Add GitHub Actions secret VERCEL_PROJECT_ID (prj_… from npx vercel link)"
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pull Vercel production env
        run: npx vercel pull --yes --environment=production
      - name: Build for Vercel
        run: npx vercel build --prod
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod
